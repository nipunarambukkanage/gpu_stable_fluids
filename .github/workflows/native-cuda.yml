name: native-cuda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cuda/**"
      - "tests/native/**"
      - ".github/workflows/native-cuda.yml"

permissions:
  contents: read

concurrency:
  group: native-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-release:
    name: CUDA release build and native contracts
    runs-on: [self-hosted, windows, cuda]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset cuda-release
      - name: Build
        run: cmake --build --preset cuda-release
      - name: Run native tests
        run: ctest --preset cuda-release
      - name: Export native smoke frame
        run: .\build\cuda-release\fluid_cuda_demo.exe --frames 2 --export-every 2 --output build\ci-smoke
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cuda-diagnostics
          path: |
            build/ci-smoke
            build/cuda-release/*.json
          if-no-files-found: ignore
